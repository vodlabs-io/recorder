name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The module names the toolchain; see the toolchain directive in go.mod.
          go-version-file: go.mod

      # vod and vlrecd embed FFmpeg, so each platform's build needs its binary
      # in place, including the runner's own for the tests. download.sh fetches
      # the pinned release and checks its hash.
      - name: Download FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for target in $(printf '%s\n' "linux/$(go env GOARCH)" linux/amd64 \
              darwin/arm64 darwin/amd64 windows/amd64 | sort -u); do
            GOOS=${target%/*} GOARCH=${target#*/} bash internal/ffmpeg/download.sh
          done

      - name: Vet
        run: |
          go vet ./...
          GOOS=linux GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test
        run: go test ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  web:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile
      # Projects the Electrobun SDK into .hutch/devkit, which tsc, the tests and
      # Vite resolve electrobun/* imports from.
      - run: bunx electrobun prepare
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bunx vite build
      - run: bun run web:build

  # Builds the image for both architectures and smoke-tests the amd64 one
  # (scripts/docker-smoke.ts). Nothing is pushed.
  docker:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every RUN step runs on the build platform, so arm64 needs no QEMU.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: vodlabs-recorder:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Smoke-test the image
        run: bun scripts/docker-smoke.ts vodlabs-recorder:ci

  # The one check branch protection requires, so adding a job here doesn't
  # need a settings change.
  ci:
    if: always()
    needs: [go, web, docker]
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Require every job to pass
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = true ]; then
            echo "::error::A CI job did not pass"
            exit 1
          fi
