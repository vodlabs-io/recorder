# Builds the patched Linux native wrapper for electrobun.
#
# Upstream's Session cookie API reads a partition through a data manager of its
# own rather than the one the partition's webviews use, so cookie reads answer
# from a snapshot frozen at first use and desktop platform login can never
# finish; patches/electrobun-1.18.1-linux-cookie-api.patch fixes it. This mirrors
# the Linux leg of electrobun's own release workflow closely enough to produce
# the one artefact we need: libNativeWrapper.so.
#
# Manual only — it only needs re-running when the patch or the pinned electrobun
# version changes. See patches/README.md.
name: Build patched electrobun native (Linux)

on:
  workflow_dispatch:
    inputs:
      electrobun_tag:
        description: "electrobun tag to patch and build"
        required: true
        default: "v1.18.1"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout recorder (for the patch)
        uses: actions/checkout@v7
        with:
          path: recorder

      - name: Checkout electrobun
        uses: actions/checkout@v7
        with:
          repository: blackboardsh/electrobun
          ref: ${{ github.event.inputs.electrobun_tag }}
          submodules: recursive
          path: electrobun

      - name: Apply patch
        shell: bash
        working-directory: electrobun
        run: |
          set -euo pipefail
          patch_file="../recorder/patches/electrobun-1.18.1-linux-cookie-api.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git --no-pager diff --stat

      # electrobun's own vendorLinuxDeps() list (package/build.ts), which is what
      # its build expects to find; libx11-dev covers the X11 calls the wrapper
      # makes directly. Built on 22.04 so the .so does not pick up a newer glibc
      # than the distros we ship to.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libx11-dev libxext-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install
        working-directory: electrobun/package

      - name: Get CEF version for cache key
        id: cef-version
        shell: bash
        working-directory: electrobun
        run: |
          CEF_VER=$(grep "const CEF_VERSION " package/src/shared/cef-version.ts | head -1 | sed "s/.*\`\(.*\)\`.*/\1/" | tr '+' '-')
          echo "version=$CEF_VER" >> $GITHUB_OUTPUT

      - name: Cache CEF vendor directory
        uses: actions/cache@v6
        with:
          path: electrobun/package/vendors/cef
          key: cef-linux-x64-${{ steps.cef-version.outputs.version }}

      - name: Build
        run: bun build.ts --release
        working-directory: electrobun/package

      - name: Upload libNativeWrapper.so
        uses: actions/upload-artifact@v7
        with:
          name: libNativeWrapper-linux-x64
          path: electrobun/package/dist/libNativeWrapper.so
          if-no-files-found: error
