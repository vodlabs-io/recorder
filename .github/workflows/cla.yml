name: CLA

# Asks each contributor to sign CLA.md once, on their first pull request, by
# posting the sign-off phrase as a comment. Signatures are committed to the
# cla-signatures branch. pull_request_target runs this workflow from main, so
# fork PRs get a token that can comment; it never checks out PR code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/vodlabs-io/recorder/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: roju,dependabot[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/vodlabs-io/recorder/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
