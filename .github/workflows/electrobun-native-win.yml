# Builds the patched Windows native wrapper for electrobun.
#
# Upstream's Session cookie API is a no-op on Windows, which blocks desktop
# platform login there; patches/electrobun-<version>-win-cookie-api.patch fixes
# it. This mirrors the Windows leg of electrobun's own release workflow closely
# enough to produce the one artefact we need: libNativeWrapper.dll, for x64 and
# ARM64.
#
# Manual only — it is slow (it vendors CEF) and only needs re-running when the
# patch or the pinned electrobun version changes. See patches/README.md.
name: Build patched electrobun native (Windows)

on:
  workflow_dispatch:
    inputs:
      electrobun_tag:
        description: "electrobun tag to patch and build"
        required: true
        default: "v2.0.5"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Upstream's own Windows runners, each compiling natively. The build
        # uses NMake under the MSVC developer prompt, so the image's Visual
        # Studio version does not matter.
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      ELECTROBUN_BUILD_ARCH: ${{ matrix.arch }}
    # A hung runner otherwise burns hours silently (GitHub's own default is 6h)
    # before anyone notices.
    timeout-minutes: 45
    steps:
      - name: Checkout recorder (for the patch)
        uses: actions/checkout@v7
        with:
          path: recorder

      - name: Checkout electrobun
        uses: actions/checkout@v7
        with:
          repository: blackboardsh/electrobun
          ref: ${{ github.event.inputs.electrobun_tag }}
          submodules: recursive
          path: electrobun

      - name: Apply patch
        shell: bash
        working-directory: electrobun
        env:
          TAG: ${{ github.event.inputs.electrobun_tag }}
        run: |
          set -euo pipefail
          patch_file="../recorder/patches/electrobun-${TAG#v}-win-cookie-api.patch"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git --no-pager diff --stat

      - uses: actions/setup-node@v7
        with:
          node-version: '18'

      - name: Install Hutch
        uses: ./electrobun/.github/actions/install-hutch

      - name: Install dependencies
        run: hutch run install
        working-directory: electrobun/package

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Get CEF version for cache key
        id: cef-version
        shell: bash
        working-directory: electrobun
        run: |
          CEF_VER=$(grep "const CEF_VERSION " package/src/shared/cef-version.ts | head -1 | sed "s/.*\`\(.*\)\`.*/\1/" | tr '+' '-')
          echo "version=$CEF_VER" >> $GITHUB_OUTPUT

      - name: Cache CEF vendor directory
        uses: actions/cache@v6
        with:
          path: electrobun/package/vendors/cef
          key: cef-win-${{ matrix.arch }}-${{ steps.cef-version.outputs.version }}

      - name: Build
        run: hutch build.ts --release --core-only
        working-directory: electrobun/package

      - name: Upload libNativeWrapper.dll
        uses: actions/upload-artifact@v7
        with:
          name: libNativeWrapper-win-${{ matrix.arch }}
          path: electrobun/package/dist/libNativeWrapper.dll
          if-no-files-found: error
