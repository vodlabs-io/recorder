name: Release

on:
  push:
    tags: ['v*']
  # A manual run builds an unsigned snapshot of everything and keeps it on the
  # run, without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # A tag push signs and publishes, so it runs in the protected `release`
    # environment, which holds the signing secrets and admits only v* tags.
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestations
      attestations: write
    env:
      # Developer ID Application certificate (.p12) and App Store Connect API
      # key (.p8), both base64-encoded. goreleaser signs and notarizes the darwin
      # vod/vlrecd binaries with them (see the notarize block in
      # .goreleaser.yaml); the desktop job signs the macOS app with the same pair.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # Azure Artifact Signing, which Authenticode-signs vod.exe and vlrecd.exe
      # (see the post hooks in .goreleaser.yaml); the desktop job signs the
      # Windows app with the same account.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      WINDOWS_SIGN_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
      WINDOWS_SIGN_ACCOUNT: ${{ vars.WINDOWS_SIGN_ACCOUNT }}
      WINDOWS_SIGN_PROFILE: ${{ vars.WINDOWS_SIGN_PROFILE }}
    steps:
      # A tag push publishes, so check before anything is built.
      # macOS builds are never published unsigned; Windows ones are, with a
      # warning, until the Artifact Signing account is set up.
      - name: Require signing configuration
        if: github.event_name == 'push'
        run: |
          for name in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set; refusing to publish unsigned macOS builds"
              exit 1
            fi
          done
          if [ -z "$WINDOWS_SIGN_ACCOUNT" ]; then
            echo "::warning::WINDOWS_SIGN_ACCOUNT is not set; publishing unsigned vod.exe and vlrecd.exe"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The module names the toolchain; see the toolchain directive in go.mod.
          go-version-file: go.mod

      - name: Set up Windows signing
        if: env.WINDOWS_SIGN_ACCOUNT != ''
        uses: ./.github/actions/setup-windows-signing
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Ties each published file to this repository, this workflow and this
      # commit; `gh attestation verify <file> --repo vodlabs-io/recorder`
      # checks it.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            scripts/install.sh
            scripts/install.ps1

      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot
          path: |
            dist/cli_*
            dist/daemon_*
            dist/checksums.txt
          retention-days: 7

  # Build the Electrobun desktop app natively on each platform. The app is
  # independent of the Go binaries above: it downloads the daemon at runtime
  # from this repository's releases. Runs after goreleaser so the release
  # already exists; each matrix leg adds its installer and update files to it.
  desktop:
    needs: goreleaser
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      # One platform failing shouldn't abort the others' uploads.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            name: macos-arm64
            installer: '*macos-arm64*.dmg'
            friendly: VodLabs-Recorder-macOS-arm64.dmg
          - runner: macos-15-intel
            name: macos-x64
            installer: '*macos-x64*.dmg'
            friendly: VodLabs-Recorder-macOS-x64.dmg
          # The Setup program reads its payload from the .installer folder
          # beside it, so Windows ships as the zip that holds both.
          - runner: windows-latest
            name: win-x64
            installer: '*win-x64*Setup*.zip'
            friendly: VodLabs-Recorder-Windows-x64-Setup.zip
          - runner: ubuntu-latest
            name: linux-x64
            installer: '*linux-x64*-Setup.tar.gz'
            friendly: VodLabs-Recorder-Linux-x64-Setup.tar.gz
    runs-on: ${{ matrix.runner }}
    env:
      # Read by scripts/sign-win-bundle.ts during the Windows build.
      WINDOWS_SIGN_ENDPOINT: ${{ vars.WINDOWS_SIGN_ENDPOINT }}
      WINDOWS_SIGN_ACCOUNT: ${{ vars.WINDOWS_SIGN_ACCOUNT }}
      WINDOWS_SIGN_PROFILE: ${{ vars.WINDOWS_SIGN_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      # Tag pushes carry the release version; manual runs build a dev snapshot.
      - name: Resolve app version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Puts the Developer ID identity in a throwaway keychain and exports the
      # ELECTROBUN_* variables that make electrobun.config.ts turn on signing
      # and notarization. Tag pushes never build unsigned; manual runs do when
      # the secrets are absent.
      - name: Set up macOS signing
        id: signing
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_SIGN_P12" ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::Secret MACOS_SIGN_P12 is not set; refusing to publish an unsigned macOS build"
              exit 1
            fi
            echo "::notice::No signing secrets; building the macOS app unsigned"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_SIGN_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_SIGN_P12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "$MACOS_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "ELECTROBUN_DEVELOPER_ID=$identity"
            echo "ELECTROBUN_APPLEAPIKEYPATH=$RUNNER_TEMP/notary.p8"
            echo "ELECTROBUN_APPLEAPIKEY=$MACOS_NOTARY_KEY_ID"
            echo "ELECTROBUN_APPLEAPIISSUER=$MACOS_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Without the configuration the Windows app builds unsigned, with a
      # warning on tag pushes. Signing happens inside the build, in the
      # postBuild hook.
      - name: Warn about an unsigned Windows build
        if: runner.os == 'Windows' && github.event_name == 'push' && env.WINDOWS_SIGN_ACCOUNT == ''
        shell: bash
        run: echo "::warning::WINDOWS_SIGN_ACCOUNT is not set; publishing an unsigned Windows build"

      - name: Set up Windows signing
        id: winsigning
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_ACCOUNT != ''
        uses: ./.github/actions/setup-windows-signing
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}

      # build:stable = `vite build && electrobun build --env=stable`. Bun runs
      # the script cross-platform; Electrobun builds for this runner's OS/arch
      # and emits artifacts/stable-<os>-<arch>-* (installer, .app.tar.zst, update.json).
      - name: Build desktop app
        run: bun run build:stable
        env:
          ELECTROBUN_APP_VERSION: ${{ steps.version.outputs.value }}

      # Electrobun fails the build only on an "Invalid" notarization verdict,
      # so confirm the DMG users download passes Gatekeeper.
      - name: Verify macOS notarization
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for dmg in artifacts/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done

      # Electrobun stamps Setup.exe out of the signed extractor after signing,
      # so confirm the installer users run, and every binary the app ships,
      # still carries a valid signature.
      - name: Verify Windows signatures
        if: steps.winsigning.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'setup-check'
          foreach ($zip in Get-ChildItem artifacts -Filter '${{ matrix.installer }}') {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $staging -Force
          }
          $files = @(Get-ChildItem $staging, build -Recurse -File -Include *.exe, *.dll)
          if (-not ($files | Where-Object Name -like '*Setup*.exe')) { throw 'No Setup exe found in the installer zip' }
          $bad = $files | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'Valid' }
          if ($bad) {
            $bad | ForEach-Object { Write-Output "::error::Not validly signed: $($_.FullName)" }
            exit 1
          }
          Get-AuthenticodeSignature -LiteralPath ($files | Where-Object Name -like '*Setup*.exe')[0].FullName |
            Select-Object Status, @{ n = 'Signer'; e = { $_.SignerCertificate.Subject } } | Format-List

      # A copy of the installer under a stable, readable name, which the README
      # and the website link through releases/latest/download/. Electrobun's
      # own files keep their names: its updater looks them up by those.
      - name: Add the download name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(artifacts/${{ matrix.installer }})
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::Expected one installer matching ${{ matrix.installer }}, found ${#found[@]}"
            ls artifacts
            exit 1
          fi
          cp "${found[0]}" "artifacts/${{ matrix.friendly }}"

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # Adds the installers to the release goreleaser created.
      - name: Publish to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          # Don't touch the notes/flags goreleaser already set on the release.
          append_body: false
          # This step UPDATES the release goreleaser created, and softprops sends
          # `prerelease` (default false) on update — which would re-flip an rc
          # release back to a full release, undoing goreleaser's prerelease:auto.
          # Mirror that rule here: a SemVer pre-release tag contains a hyphen
          # (e.g. v1.2.3-rc.4), so keep those flagged as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ github.token }}

      # Manual run: goreleaser only built a snapshot (no release), so keep the
      # desktop artifacts on the workflow run instead.
      - name: Upload snapshot artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.name }}
          path: artifacts/*
          retention-days: 7
