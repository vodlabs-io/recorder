# One Shot per vodlabs.io platform page: the VOD Archive filtered to that
# platform. Render with:
#   bun tools/showcase/harness/render.ts tools/showcase/shots/platform-pages.yaml
dataset: platform-pages
now: 2026-09-24T20:30:00-07:00
timezone: America/Los_Angeles
app_version: 1.0.0

defaults:
  size: [1280, 800]
  scale: 2
  themes: [light, dark]

scenes:
  - name: tiktok
    route: /vods
    steps:
      - wait: text=lanternfox_tv
      - click: text=All platforms
      - click: role=option[name="TikTok"]
      - wait: 800
