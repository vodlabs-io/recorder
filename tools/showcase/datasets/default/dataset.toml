# The default Demo dataset: 17 fictional Streamers on 8 Platforms and their
# VODs. Every time below is an offset back from "now" — the demo daemon's
# --now, or the real time — so the dataset always looks current. Field
# reference: tools/showcase/README.md.
#
# Usernames are invented and confirmed absent from their Platform (see each
# `verified`). Avatars are generated from their prompts; thumbnails are real
# stream frames (see the VODs section).

version = "1.0.0"
uptime = "3d4h12m"
download_dir = "/Users/demo/Movies/VodLabs Recorder"
archive_dir = "/Volumes/Vault/VodLabs"

[[root]]
paths = ["/Users/demo/Movies/VodLabs Recorder"]
download = true
total = "1TB"
free = "412GB"

[[root]]
paths = ["/Volumes/Vault/VodLabs"]
total = "8TB"
free = "5.3TB"

